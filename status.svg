<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 130" width="900" height="130" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">À la recherche d'un stage en développement web ou en développement de jeux vidéo à partir de mars 2027</title>
<defs><filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
  <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
</filter></defs>
<style>
text{font-family:'Stack Sans Text','Segoe UI','Helvetica Neue',Arial,sans-serif;font-size:21px;fill:#e9eef0}
.b{font-weight:600;fill:#6bdfff}
.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2s ease-out infinite}
@keyframes pulse{0%{transform:scale(1);opacity:.8}100%{transform:scale(2.6);opacity:0}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
</style>
<rect x="2" y="2" width="896" height="126" rx="24" fill="#333" stroke="#6bdfff" stroke-opacity="0.5" stroke-width="2" filter="url(#soft)"/>
<g transform="translate(46 65)"><circle class="pulse" r="9" fill="#6bdfff"/><circle r="9" fill="#6bdfff" filter="url(#soft)"/></g>
<text x="86" y="53">Actuellement à la recherche d’un stage en <tspan class="b">développement web</tspan></text>
<text x="86" y="88">ou en <tspan class="b">développement de jeux vidéo</tspan>, à partir de <tspan class="b">mars 2027</tspan>.</text>
</svg>